services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aayojan
      POSTGRES_PASSWORD: aayojan_local_password
      POSTGRES_DB: aayojan
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/001_init_aayojan.sql:/docker-entrypoint-initdb.d/001_init_aayojan.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aayojan"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
